<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE088" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#735C00" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#721324" />
      <stop offset="100%" stop-color="#40000D" />
    </linearGradient>
  </defs>

  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#goldGrad)" />
  <circle cx="100" cy="100" r="90" fill="url(#maroonGrad)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,3" />

  <!-- Central Crest Shield -->
  <path d="M100,35 L145,55 C145,110 120,145 100,165 C80,145 55,110 55,55 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Open Book Symbol inside Shield -->
  <path d="M70,95 Q85,85 100,95 Q115,85 130,95 L130,125 Q115,115 100,125 Q85,115 70,125 Z" fill="#FFF8F4" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M100,95 L100,125" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Flaming Knowledge Torch on top of book -->
  <path d="M96,80 L104,80 L102,92 L98,92 Z" fill="url(#goldGrad)" />
  <!-- Flame -->
  <path d="M100,58 Q108,68 103,78 Q100,80 97,78 Q92,68 100,58 Z" fill="#F59E0B" />
  <path d="M100,64 Q104,71 101,77 Q100,78 99,77 Q95,71 100,64 Z" fill="#FFE088" />

  <!-- Stars -->
  <polygon points="100,138 102,143 107,143 103,146 105,151 100,148 95,151 97,146 93,143 98,143" fill="url(#goldGrad)" />
  <polygon points="75,130 76.5,134 81,134 77.5,136.5 79,140.5 75,138 71,140.5 72.5,136.5 69,134 73.5,134" fill="url(#goldGrad)" />
  <polygon points="125,130 126.5,134 131,134 127.5,136.5 129,140.5 125,138 121,140.5 122.5,136.5 119,134 123.5,134" fill="url(#goldGrad)" />
</svg>
